[package]
name = "wordflow-cleanup"
version = "2.0.0"
description = "Runs WordFlow's local cleanup and Granite speech models, in their own process"
edition = "2024"
rust-version = "1.88"
publish = false

# A separate program, not part of the app binary: whisper.cpp and llama.cpp each
# bundle their own, different version of ggml, and only one copy of its symbols
# survives linking. See README.md.

[dependencies]
base64 = "0.22"
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["mtmd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["metal", "mtmd"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
