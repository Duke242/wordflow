[package]
name = "wordflow"
version = "2.0.0"
description = "Offline voice dictation for macOS, Windows and Linux"
edition = "2024"
rust-version = "1.88"

[lib]
name = "wordflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Dock and task manager show this name while developing.
[[bin]]
name = "WordFlow"
path = "src/main.rs"

[features]
# GPU backends for whisper.cpp. CPU is the default so a plain build works everywhere.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = "0.16"
arboard = "3"
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
regex = "1"
semver = "1"
uuid = { version = "1", features = ["v4"] }
hound = "3"
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav", "pcm", "adpcm", "aiff", "caf", "mkv"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# Parakeet, through ONNX Runtime. It has no build for Intel Macs (see build.rs).
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx", "ort-coreml"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal", "coreml"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# MPRIS, to pause media players while dictating. Already used by Tauri's plugins.
zbus = "5"

# UI Automation, to read the focused text field (learning corrections), and
# the system media controls, to pause media while dictating.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_in_result = "warn"
